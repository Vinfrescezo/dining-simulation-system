spring.application.name=dining_simulation
server.port=8080

# 轻量级 H2 文件数据库：不需要安装 MySQL，报告历史保存在 backend/data/dining-sim-db.mv.db
spring.datasource.url=jdbc:h2:file:./data/dining-sim-db;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# DeepSeek 智能分析报告：API Key 从环境变量读取，避免写死到代码中
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
